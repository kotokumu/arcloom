[package]
name = "arcloom-os"
version = "0.1.0"
edition = "2021"

[dependencies]
arcloom-kernel = { path = "kernel" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
wasmtime = { version = "38.0.4", default-features = false, features = ["cranelift", "runtime", "component-model", "std"] }
wit-component = "0.239"

[dev-dependencies]
tempfile = "3"
wat = "1.239"
