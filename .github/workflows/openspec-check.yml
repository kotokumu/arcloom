name: OpenSpec Check

on:
  pull_request:
    paths:
      - ".agents/skills/openspec-*/**"
      - ".claude/skills/openspec-*/**"
      - ".github/workflows/openspec-check.yml"
      - "openspec/**"
      - "tools/archive-change.mjs"
      - "tools/archive-change.test.mjs"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.10.0

      - name: Validate schema
        run: openspec schema validate quality-spec

      - name: Validate main specs
        run: openspec validate --specs --strict

      - name: Validate active changes
        run: openspec validate --changes --strict

      - name: Test publication workflow
        run: node --test tools/archive-change.test.mjs
