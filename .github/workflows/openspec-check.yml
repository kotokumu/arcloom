name: OpenSpec Check

on:
  pull_request:
    paths:
      - ".agents/skills/openspec-*/**"
      - ".claude/skills/openspec-*/**"
      - ".github/workflows/openspec-check.yml"
      - "openspec/**"
      - ".remarkignore"
      - ".remarkrc.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install static analysis tools
        run: npm ci

      - name: Analyze Markdown and OpenSpec
        run: npm run lint
